# Dipicu oleh tool build_apk di aplikasi (git push). Artifact 'mythos-debug' diunduh balik oleh skrip tools/build-github.sh.
name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: 25.2.9519653
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ runner.android.android-home }}
          ANDROID_SDK_ROOT: ${{ runner.android.android-home }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mythos-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error